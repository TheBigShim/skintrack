<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E7E1D3">
<title>Skin Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#E7E1D3;
    --surface:#F5F2E9;
    --ink:#2B2A25;
    --ink-soft:#6B6558;
    --line:#D8D1BE;
    --taz:#4B6455;
    --taz-soft:#DCE5DC;
    --aze:#A6572E;
    --aze-soft:#EFDDD0;
    --skip:#B7AF9B;
    --radius:18px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:48px;
  }
  a,button{font-family:inherit;}
  button{cursor:pointer;}
  button:focus-visible, a:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 20px 0;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  header.top .date{
    font-family:'Fraunces',serif;
    font-weight:450;
    font-size:26px;
    letter-spacing:-0.01em;
  }
  header.top .date small{
    display:block;
    font-family:'Archivo',sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:2px;
  }

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:450;
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 10px;
    letter-spacing:0.01em;
  }

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:12px;
    border-left:5px solid var(--product-color, var(--line));
  }
  .card .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:450;
  }
  .card .status{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    display:inline-block;
    background:var(--product-color);
    margin-right:7px;
    position:relative;
    top:-1px;
  }
  .actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .btn{
    flex:1;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink);
    padding:10px 8px;
    border-radius:var(--radius-sm);
    font-size:14px;
    font-weight:600;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn.applied.is-active{
    background:var(--product-color);
    border-color:var(--product-color);
    color:#FBF9F3;
  }
  .btn.skipped.is-active{
    background:var(--skip);
    border-color:var(--skip);
    color:#FBF9F3;
  }

  .streak-line{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .streak-line strong{
    color:var(--ink);
    font-weight:700;
  }

  .week{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
  }
  .week-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:4px;
  }
  .week-day{
    text-align:center;
  }
  .week-day .dlabel{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:8px;
    font-weight:600;
  }
  .week-day .pips{
    display:flex;
    flex-direction:column;
    gap:5px;
    align-items:center;
  }
  .pip{
    width:11px;height:11px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;
  }
  .pip.applied{ background:var(--pip-color); border-color:var(--pip-color); }
  .pip.skipped{ background:var(--skip); border-color:var(--skip); }
  .week-day.is-today .dlabel{ color:var(--ink); }

  .history{
    margin-bottom:8px;
  }
  .hist-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 2px;
    border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-date{
    font-size:14px;
    font-weight:600;
  }
  .hist-marks{
    display:flex;
    gap:14px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .hist-marks span{ display:flex; align-items:center; }

  .empty{
    font-size:14px;
    color:var(--ink-soft);
    padding:18px 2px;
    line-height:1.5;
  }

  .reset-wrap{
    text-align:center;
    margin-top:30px;
  }
  .reset-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:8px;
  }

  .foot-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="date" id="todayLabel">—<small id="todaySub"></small></div>
  </header>

  <h2 class="section-title">Today</h2>

  <div class="card" style="--product-color:var(--taz)" data-product="tazarotene">
    <div class="row">
      <div>
        <div class="name">Tazarotene</div>
        <div class="status" data-status-for="tazarotene">Not logged yet</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn applied" data-action="applied" data-product="tazarotene">Applied</button>
      <button class="btn skipped" data-action="skipped" data-product="tazarotene">Skipped</button>
    </div>
    <div class="streak-line" data-streak-for="tazarotene"></div>
  </div>

  <div class="card" style="--product-color:var(--aze)" data-product="azelaic">
    <div class="row">
      <div>
        <div class="name">Azelaic acid</div>
        <div class="status" data-status-for="azelaic">Not logged yet</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn applied" data-action="applied" data-product="azelaic">Applied</button>
      <button class="btn skipped" data-action="skipped" data-product="azelaic">Skipped</button>
    </div>
    <div class="streak-line" data-streak-for="azelaic"></div>
  </div>

  <div class="week">
    <h2 class="section-title" style="margin-bottom:2px;">This week</h2>
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <h2 class="section-title">History</h2>
  <div class="history card" id="historyList" style="border-left:5px solid var(--line);"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">Clear all data</button>
    <div class="foot-note">Stored only on this phone, in this browser. Add this page to your home screen for one-tap access.</div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'skinLogV1';
  var PRODUCTS = ['tazarotene','azelaic'];

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { entries: {} };
    }catch(e){
      return { entries: {} };
    }
  }
  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable — app still works for this session */ }
  }

  var state = loadState();

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function keyFor(date){
    return date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate());
  }
  function startOfToday(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }
  var today = startOfToday();
  var todayKey = keyFor(today);

  function getEntry(dKey){
    return state.entries[dKey] || {};
  }
  function setStatus(dKey, product, status){
    var entry = state.entries[dKey] || {};
    if(entry[product] === status){
      delete entry[product];
    } else {
      entry[product] = status;
    }
    if(Object.keys(entry).length === 0){
      delete state.entries[dKey];
    } else {
      state.entries[dKey] = entry;
    }
    saveState(state);
    renderAll();
  }

  function currentStreak(product){
    var count = 0;
    var cursor = new Date(today);
    var entryToday = getEntry(todayKey)[product];
    if(!entryToday){
      cursor.setDate(cursor.getDate() - 1);
    }
    while(true){
      var k = keyFor(cursor);
      var st = getEntry(k)[product];
      if(st === 'applied'){
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return count;
  }

  function renderToday(){
    var todayLabel = document.getElementById('todayLabel');
    var todaySub = document.getElementById('todaySub');
    var fmt = new Intl.DateTimeFormat(undefined, { weekday:'short', month:'short', day:'numeric' });
    todayLabel.firstChild.textContent = fmt.format(today) + ' ';
    todaySub.textContent = 'Skin log';

    PRODUCTS.forEach(function(product){
      var entry = getEntry(todayKey);
      var st = entry[product];
      var statusEl = document.querySelector('[data-status-for="'+product+'"]');
      var appliedBtn = document.querySelector('.btn.applied[data-product="'+product+'"]');
      var skippedBtn = document.querySelector('.btn.skipped[data-product="'+product+'"]');

      appliedBtn.classList.toggle('is-active', st === 'applied');
      skippedBtn.classList.toggle('is-active', st === 'skipped');

      if(st === 'applied') statusEl.textContent = 'Applied today';
      else if(st === 'skipped') statusEl.textContent = 'Skipped today';
      else statusEl.textContent = 'Not logged yet';

      var streak = currentStreak(product);
      var streakEl = document.querySelector('[data-streak-for="'+product+'"]');
      streakEl.innerHTML = streak > 0
        ? 'Current streak: <strong>' + streak + ' day' + (streak === 1 ? '' : 's') + '</strong>'
        : 'No active streak yet';
    });
  }

  function renderWeek(){
    var grid = document.getElementById('weekGrid');
    grid.innerHTML = '';
    var dayLabels = ['M','T','W','T','F','S','S'];
    var mondayOffset = (today.getDay() + 6) % 7;
    var monday = new Date(today);
    monday.setDate(monday.getDate() - mondayOffset);

    for(var i=0;i<7;i++){
      var d = new Date(monday);
      d.setDate(d.getDate() + i);
      var isFuture = d > today;
      var isToday = keyFor(d) === todayKey;
      var entry = getEntry(keyFor(d));

      var dayEl = document.createElement('div');
      dayEl.className = 'week-day' + (isToday ? ' is-today' : '');

      var label = document.createElement('div');
      label.className = 'dlabel';
      label.textContent = dayLabels[i];
      dayEl.appendChild(label);

      var pips = document.createElement('div');
      pips.className = 'pips';

      PRODUCTS.forEach(function(product){
        var pip = document.createElement('div');
        var st = isFuture ? undefined : entry[product];
        var colorVar = product === 'tazarotene' ? 'var(--taz)' : 'var(--aze)';
        pip.className = 'pip' + (st ? ' ' + st : '');
        pip.style.setProperty('--pip-color', colorVar);
        pips.appendChild(pip);
      });

      dayEl.appendChild(pips);
      grid.appendChild(dayEl);
    }
  }

  function renderHistory(){
    var list = document.getElementById('historyList');
    var keys = Object.keys(state.entries).sort().reverse();
    keys = keys.filter(function(k){ return k !== todayKey; }).slice(0, 90);

    if(keys.length === 0){
      list.innerHTML = '<div class="empty">Nothing logged yet before today. Once you mark tazarotene or azelaic acid above, it\'ll show up here.</div>';
      return;
    }

    var fmt = new Intl.DateTimeFormat(undefined, { weekday:'short', month:'short', day:'numeric' });
    var yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    var yKey = keyFor(yesterday);

    list.innerHTML = keys.map(function(k){
      var entry = state.entries[k];
      var parts = k.split('-').map(Number);
      var d = new Date(parts[0], parts[1]-1, parts[2]);
      var label = k === yKey ? 'Yesterday' : fmt.format(d);

      function markFor(product, dotColor){
        var st = entry[product];
        var text = st === 'applied' ? 'Applied' : st === 'skipped' ? 'Skipped' : '—';
        var opacity = st ? '1' : '0.5';
        return '<span style="opacity:'+opacity+'"><span class="dot" style="background:'+dotColor+'"></span>'+text+'</span>';
      }

      return '<div class="hist-row"><div class="hist-date">'+label+'</div>' +
        '<div class="hist-marks">' +
        markFor('tazarotene','#4B6455') +
        markFor('azelaic','#A6572E') +
        '</div></div>';
    }).join('');
  }

  function renderAll(){
    renderToday();
    renderWeek();
    renderHistory();
  }

  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var product = btn.getAttribute('data-product');
      var action = btn.getAttribute('data-action');
      setStatus(todayKey, product, action);
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('Clear all logged skincare data on this phone? This can\'t be undone.')){
      state = { entries: {} };
      saveState(state);
      renderAll();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
